[package]
name = "context-surgeon"
version = "0.1.0"
edition = "2021"
authors = ["Katie"]
description = "Intelligently compress context to fit token limits"
license = "MIT"
repository = "https://github.com/sudokatie/context-surgeon"
keywords = ["llm", "context", "compression", "tokens"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tiktoken-rs = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
rayon = "1"
unicode-segmentation = "1"
thiserror = "1"
lazy_static = "1"
rand = "0.8"
rustc-hash = "1"
dirs = "5"
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[bin]]
name = "context-surgeon"
path = "src/main.rs"
